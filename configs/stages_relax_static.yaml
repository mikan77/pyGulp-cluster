final_symmetry:
  required: true
  symprec: 0.05
  angle_tolerance: 5.0

stages:
  - name: fixed_cell
    symmetry_mode: "off"
    require_convergence: false
    # Set to false only if GULP output format does not print atom-count checks
    validate_atom_counts: false
    keywords: |
      opti conj reaxff conv qiter spat
      parallel better_scaling
    options: |
      ftol 1e-5
      gtol 1e-3
      xtol 1e-5
      maxcyc 500
      stepmx 0.05

  - name: variable_cell
    symmetry_mode: auto
    require_convergence: false
    keywords: |
      opti conj reaxff conp qiter spat
      parallel better_scaling
    options: |
      ftol 1e-5
      gtol 5e-4
      xtol 1e-5
      maxcyc 1000
      stepmx 0.02

  - name: static
    symmetry_mode: auto
    keywords: |
      single reaxff qiter spat
      parallel better_scaling
